services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/budjet.sqlite3
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
    volumes:
      - api_data:/data
      - ./service-account.json:/secrets/service-account.json:ro
    # Not published: only Caddy talks to the API.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  api_data:
  caddy_data:
  caddy_config:
