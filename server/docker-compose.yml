services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/budjet.sqlite3
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
    volumes:
      - api_data:/data
      - ./service-account.json:/secrets/service-account.json:ro
    # Not published: only Caddy talks to the API.
    expose:
      - "8000"

  caddy:
    # Pinned: newer Caddy builds (Go 1.25+) crashed at startup on some VPS kernels
    # ("panic on system stack" while reading container CPU limits). Upgrade deliberately.
    image: caddy:2.9.1
    restart: unless-stopped
    # Default: Caddy takes ports 80 and 443. When they are busy, see README ("Порты заняты"):
    # HTTP_BIND=127.0.0.1:8080, CADDY_HTTP_PORT=8080, HTTPS_BIND=8443, CADDY_HTTPS_PORT=8443.
    ports:
      - "${HTTP_BIND:-80}:${CADDY_HTTP_PORT:-80}"
      - "${HTTPS_BIND:-443}:${CADDY_HTTPS_PORT:-443}"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      # Go 1.25+ only (ignored by older builds): skip reading cgroup CPU limits at startup.
      GODEBUG: containermaxprocs=0,updatemaxprocs=0
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  api_data:
  caddy_data:
  caddy_config:
