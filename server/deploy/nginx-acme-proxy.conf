# For a server where nginx already owns port 80 (Caddy runs on 8080/8443, see README).
# Copy to /etc/nginx/conf.d/budjet-api.conf, replace the domain if needed, then:
#   nginx -t && systemctl reload nginx
# Only requests for this one domain are affected; other nginx sites keep working.
server {
    listen 80;
    listen [::]:80;
    server_name api.findwibe.com;

    # Let's Encrypt checks the domain here; Caddy answers on 127.0.0.1:8080.
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Nothing else is served over plain HTTP.
    location / {
        return 301 https://$host:8443$request_uri;
    }
}
